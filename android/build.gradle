plugins { id 'com.android.application' version '8.11.2' apply false }
// Keep generated files outside the Unicode checkout/junction on Windows.
allprojects {
    if (System.getenv('KI_ANDROID_BUILD_ROOT')) {
        layout.buildDirectory = file(System.getenv('KI_ANDROID_BUILD_ROOT') + '/' + project.name)
    }
}
