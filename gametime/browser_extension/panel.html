<!doctype html>
<html lang="hu">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Keep Improving</title>
    <link rel="icon" href="icons/32.png" />
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body class="dashboard">
    <aside>
      <a class="brand" href="panel.html"
        ><img src="icons/48.png" alt="" /><strong>Keep Improving</strong></a
      >
      <nav id="nav" aria-label="Navigation"></nav>
      <div class="sidebar-bottom">
        <div id="settings-nav"></div>
        <div class="language-switch">
          <button id="language" type="button" value="hu" aria-label="Language / Nyelv"
            aria-haspopup="listbox" aria-expanded="false" aria-controls="language-options">
            <img id="language-flag" src="icons/flag-hu.svg" alt="" />
            <span id="language-name">Magyar</span><span class="language-arrow" aria-hidden="true">⌄</span>
          </button>
          <div id="language-options" role="listbox" aria-label="Language / Nyelv" hidden>
            <button type="button" role="option" data-language="hu" aria-selected="true" tabindex="-1">
              <img src="icons/flag-hu.svg" alt="" /><span lang="hu">Magyar</span>
            </button>
            <button type="button" role="option" data-language="en" aria-selected="false" tabindex="-1">
              <img src="icons/flag-en.svg" alt="" /><span lang="en">English</span>
            </button>
          </div>
        </div>
        <span id="connection" class="sr-only" role="status"></span>
      </div>
    </aside>
    <main id="main">
      <header>
        <button
          id="page-back"
          class="quiet icon-button"
          aria-label="Back"
          hidden
        >
          ←
        </button>
        <h1 id="heading"></h1>
        <div id="header-actions" class="row"></div>
      </header>
      <p id="status" role="status" aria-live="polite"></p>
      <div id="content"></div>
    </main>
    <dialog id="dialog"><div id="dialog-content"></div></dialog>
    <script src="local_update.js"></script>
    <script type="module" src="panel.js"></script>
  </body>
</html>
